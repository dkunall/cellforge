spring:
  application:
    name: cellforge-edge
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${EDGE_DB_URL:jdbc:postgresql://localhost:5432/directory}
    username: ${EDGE_DB_USER:cellforge}
    password: ${EDGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${EDGE_DB_POOL:16}
      connection-timeout: 3000
  flyway:
    locations: classpath:db/edge
  data:
    redis:
      host: ${CELLFORGE_REDIS_HOST:localhost}
      port: ${CELLFORGE_REDIS_PORT:6379}
      password: ${CELLFORGE_REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${CELLFORGE_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Never hold a request thread for long when Kafka is away; the event is dropped instead.
        max.block.ms: 1000
        linger.ms: 5
    consumer:
      group-id: cellforge-edge
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CELLFORGE_JWT_ISSUER:http://localhost:7891/cellforge}

server:
  port: ${PORT:7890}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cellforge:
  # Cell id to internal base URL. Ids are stable; URLs may change between restarts.
  cells:
    cell-a: ${CELL_A_URL:http://localhost:8081}
    cell-b: ${CELL_B_URL:http://localhost:8082}
  service-token:
    uri: ${CELLFORGE_TOKEN_URI:http://localhost:7891/cellforge/token}
    client-id: ${CELLFORGE_CLIENT_ID:cellforge-edge}
    client-secret: ${CELLFORGE_CLIENT_SECRET}
  payments:
    # Shared with the payment provider; the edge rejects webhooks it cannot verify with it.
    webhook-secret: ${CELLFORGE_WEBHOOK_SECRET}
  billing:
    sweep: ${CELLFORGE_BILLING_SWEEP:true}
    sweep-interval: PT1M
